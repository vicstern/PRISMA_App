<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula Viva® — Mantenimiento</title>
  <style>
    :root {
      --bg: #090d13;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-blue: #58a6ff;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }
    h1 span.reg {
      font-size: 1rem;
      vertical-align: super;
      font-weight: 400;
      color: var(--text-muted);
    }
    .rainbow-text {
      background: linear-gradient(90deg, #FFFFFF 0%, #FFFFFF 28%, #E2E8F0 36%, #C084FC 48%, #60A5FA 58%, #38BDF8 68%, #4ADE80 78%, #FACC15 86%, #FB923C 93%, #F87171 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      font-weight: 600;
    }
    p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 600px;
      line-height: 1.5;
    }
    .loader {
      margin-top: 30px;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(88, 166, 255, 0.2);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Aula Viva<span class="reg">®</span></h1>
  <p class="rainbow-text">ASPIRE® · PRISMA™</p>
  <br>
  <p>Nos estamos mudando a una nueva arquitectura de servidores.<br>Estaremos de regreso en línea en unos minutos.</p>
  <p style="font-size: 0.9rem; margin-top: 10px;"><em>Upgrading repository infrastructure... Back online shortly.</em></p>
  <div class="loader"></div>
</body>
</html>
