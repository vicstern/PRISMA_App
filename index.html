<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AULA VIVA — PRISMA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 48px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 2.4rem;
      letter-spacing: -0.03em;
      margin: 0 0 8px 0;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 1.15rem;
      color: #8b949e;
      margin: 0 auto 32px auto;
      max-width: 680px;
      line-height: 1.5;
    }
    .preview-card {
      max-width: 1040px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #30363d;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      background-color: #161b22;
    }
    .preview-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .btn-container {
      margin-top: 36px;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background-color: #238636;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn:hover {
      background-color: #2ea043;
    }
    .btn:active {
      transform: scale(0.98);
    }
    footer {
      margin-top: auto;
      padding-top: 56px;
      font-size: 0.85rem;
      color: #6e7681;
      line-height: 1.6;
    }
    footer a {
      color: #58a6ff;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>AULA VIVA</h1>
  <p class="subtitle">PRISMA — Offline Edge-AI for Qualitative Educational Assessment in ℝ⁸</p>

  <div class="preview-card">
    <img src="screenshot.png" alt="PRISMA Interface and R8 Qualitative Radar Graph">
  </div>

  <div class="btn-container">
    <a class="btn" href="https://github.com/vicstern/PRISMA_App" target="_blank" rel="noopener noreferrer">
      View Open-Source Repository on GitHub
    </a>
  </div>

  <footer>
    Aula Viva &bull; Independent Research &bull; Grounded in <a href="https://doi.org/10.2139/ssrn.7310080" target="_blank" rel="noopener noreferrer">SSRN DOI: 10.2139/ssrn.7310080</a>
  </footer>

</body>
</html>
